name: ToyChain CI

on:
  push:
    paths:
      - "toychain/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "toychain/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: toychain
    steps:
      - uses: actions/checkout@v5
      # toychain/rust-toolchain.toml pins the exact version; rustup installs it on demand.
      - name: Show toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: toychain/Cargo.toml
          command: check

  vet:
    name: cargo-vet (reviewed dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toychain
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-vet
        run: cargo install --locked cargo-vet --version 0.10.2
      # --locked: use supply-chain/imports.lock, no network fetch of audits.
      - name: Vet
        run: cargo vet --locked

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_address
          - parse_mnemonic
          - parse_derivation_path
          - recover_eip155
          - bls_decode_verify
          - vrf_verify
          - rlp_decode
          - decode_transaction
          - decode_ticket
    defaults:
      run:
        working-directory: toychain/fuzz
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz for 5 minutes
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: toychain/fuzz/artifacts

  kani:
    name: Kani proofs (${{ matrix.harness }})
    runs-on: ubuntu-latest
    # Blocking since 2026-10-20: the three proofs finished reliably in
    # under 2 minutes in every run, and a non-blocking job once hid a
    # real failure (PR #3). 15 minutes leaves room without hiding hangs.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The block-mint proofs with a non-zero share did not finish within
        # 30 minutes (see docs/STATUS.md); block_mint checks its sum at runtime.
        harness:
          - emission_at_max_factor_never_exceeds_remaining
          - issued_stays_within_cap_at_max_factor
          - block_mint_adds_up_bootstrap_no_share
    steps:
      - uses: actions/checkout@v5
      # Pinned to a commit (branch v1 as of 2026-10-20) and a Kani version,
      # so a new Kani release cannot turn a blocking job red on its own.
      # Update both deliberately.
      - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          working-directory: toychain
          args: -p toy-emission --harness ${{ matrix.harness }}
