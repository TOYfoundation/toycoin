name: ToyChain CI

on:
  push:
    paths:
      - "toychain/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "toychain/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: toychain
    steps:
      - uses: actions/checkout@v4
      # toychain/rust-toolchain.toml pins the exact version; rustup installs it on demand.
      - name: Show toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: toychain/Cargo.toml
          command: check

  kani:
    name: Kani proofs (supply cap, block mint)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # New job: kept non-blocking until the first runs show its duration.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          working-directory: toychain
          args: -p toy-emission
