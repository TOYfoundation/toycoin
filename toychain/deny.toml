# cargo-deny: licenses, security advisories and sources of all dependencies
# (decision 101). Allowed licenses must be compatible with MIT (CLAUDE.md).
# MPL-2.0 is allowed only per crate, for unmodified libraries such as
# UniFFI (decision 77); add such crates under [[licenses.exceptions]].

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies of this private workspace have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
