name: ToyChain CI

on:
  push:
    paths:
      - "toychain/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "toychain/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: toychain
    steps:
      - uses: actions/checkout@v4
      # toychain/rust-toolchain.toml pins the exact version; rustup installs it on demand.
      - name: Show toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
