name: ToyChain CI

on:
  push:
    paths:
      - "toychain/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "toychain/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: toychain
    steps:
      - uses: actions/checkout@v5
      # toychain/rust-toolchain.toml pins the exact version; rustup installs it on demand.
      - name: Show toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: toychain/Cargo.toml
          command: check

  kani:
    name: Kani proofs (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Kept non-blocking until the proofs have finished reliably a few times.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        harness:
          - emission_at_max_factor_never_exceeds_remaining
          - issued_stays_within_cap_at_max_factor
          - block_mint_adds_up_normal_phase
          - block_mint_adds_up_bootstrap_full_share
          - block_mint_adds_up_bootstrap_partial_share
          - block_mint_adds_up_bootstrap_no_share
    steps:
      - uses: actions/checkout@v5
      - uses: model-checking/kani-github-action@v1
        with:
          working-directory: toychain
          args: -p toy-emission --harness ${{ matrix.harness }}
